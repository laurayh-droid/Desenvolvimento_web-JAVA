

services:

  mysql-appointment:
    image: mysql:8.0
    restart: unless-stopped
    command: ["mysqld", "--default-authentication-plugin=mysql_native_password"]
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: appointment_db
    ports:
      - "3309:3306"
    volumes:
      - mysql_appointment_data:/var/lib/mysql
      - ./banco_appointment.sql:/docker-entrypoint-initdb.d/banco_appointment.sql:ro
    networks:
      - clinica-medica
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s


  appointment-service:
    build:
      context: appointment-service
      dockerfile: Dockerfile
      args:
        JAR_FILE: target/appointment-service-1.0.0.jar
    container_name: appointment-service
    image: imepac/appointment-service:1.0.0
    ports:
      - "8083:8083"
    environment:
      DB_HOST: mysql-appointment
      DB_PORT: 3306
      DB_NAME: appointment_db
      DB_USER: root
      DB_PASSWORD: root
    networks:
      - clinica-medica
    depends_on:
      mysql-appointment:
        condition: service_healthy
    restart: on-failure

  mysql-administrative:
    image: mysql:8.0
    restart: unless-stopped
    command: ["mysqld", "--default-authentication-plugin=mysql_native_password"]
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: administrative_db
    ports:
      - "3310:3306"
    volumes:
      - mysql_administrative_data:/var/lib/mysql
      - ./banco_administrative.sql:/docker-entrypoint-initdb.d/banco_administrative.sql:ro
    networks:
      - clinica-medica
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s


  administrative-service:
    build:
      context: administrative-service
      dockerfile: Dockerfile
      args:
        JAR_FILE: target/administrative-service-1.0.0.jar
    container_name: administrative-service
    image: imepac/administrative-service:1.0.0
    ports:
      - "8084:8084"
    environment:
      DB_HOST: mysql-administrative
      DB_PORT: 3306
      DB_NAME: administrative_db
      DB_USER: root
      DB_PASSWORD: root
    networks:
      - clinica-medica
    depends_on:
      mysql-administrative:
        condition: service_healthy
    restart: on-failure

  mysql-attendance:
    image: mysql:8.0
    restart: unless-stopped
    command: ["mysqld", "--default-authentication-plugin=mysql_native_password"]
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: attendance_db
    ports:
      - "3311:3306"
    volumes:
      - mysql_attendance_data:/var/lib/mysql
      - ./banco_attendance.sql:/docker-entrypoint-initdb.d/banco_attendance.sql:ro
    networks:
      - clinica-medica
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s


  attendance-service:
    build:
      context: attendance-service
      dockerfile: Dockerfile
      args:
        JAR_FILE: target/attendance-service-1.0.0.jar
    container_name: attendance-service
    image: imepac/attendance-service:1.0.0
    ports:
      - "8085:8085"
    environment:
      DB_HOST: mysql-attendance
      DB_PORT: 3306
      DB_NAME: attendance_db
      DB_USER: root
      DB_PASSWORD: root
    networks:
      - clinica-medica
    depends_on:
      mysql-attendance:
        condition: service_healthy
    restart: on-failure

  gateway-service:
    build:
      context: gateway-service
      dockerfile: Dockerfile
      args:
        JAR_FILE: target/gateway-service-1.0.0.jar
    container_name: gateway-service
    image: imepac/gateway-service:1.0.0
    ports:
      - "8080:8080"
    networks:
      - clinica-medica
    depends_on:
      appointment-service:
        condition: service_started
      administrative-service:
        condition: service_started
      attendance-service:
        condition: service_started
    restart: on-failure

networks:
  clinica-medica:
    driver: bridge

volumes:
  mysql_appointment_data:
  mysql_administrative_data:
  mysql_attendance_data:



