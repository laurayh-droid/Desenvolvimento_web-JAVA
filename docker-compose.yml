version: '3.8'

services:



  mysql-appointment:
    image: mysql:8.0
    container_name: mysql-appointment
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: appointment_db
    ports:
      - "3309:3306"
    volumes:
      - mysql_appointment_data:/var/lib/mysql
    networks:
      - order-system-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  appointment-service:
    build:
      context: appointment-service
      dockerfile: Dockerfile
      args:
        JAR_FILE: target/appointment-service-1.0.0.jar
    container_name: appointment-service
    image: imepac/appointment-service:1.0.0
    ports:
      - "8083:8083"
    environment:
      DB_HOST: mysql-appointment
      DB_PORT: 3306
      DB_NAME: appointment_db
      DB_USER: root
      DB_PASSWORD: root
    networks:
      - order-system-network
    depends_on:
      mysql-appointment:
        condition: service_healthy
    restart: on-failure

networks:
  order-system-network:
    driver: bridge

volumes:
  mysql_appointment_data:


