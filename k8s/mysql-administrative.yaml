apiVersion: apps/v1
kind: Deployment
metadata:
  name: mysql-administrative
  labels:
    app: mysql-administrative
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mysql-administrative
  template:
    metadata:
      labels:
        app: mysql-administrative
    spec:
      containers:
        - name: mysql-administrative
          image: mysql:8.0
          env:
            - name: MYSQL_ROOT_PASSWORD
              value: root
            - name: MYSQL_DATABASE
              value: administrative_db
          ports:
            - containerPort: 3306
          volumeMounts:
            - name: mysql-data
              mountPath: /var/lib/mysql
      volumes:
        - name: mysql-data
          persistentVolumeClaim:
            claimName: mysql-administrative-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: mysql-administrative
spec:
  selector:
    app: mysql-administrative
  ports:
    - protocol: TCP
      port: 3306
      targetPort: 3306
  type: ClusterIP
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mysql-administrative-pvc
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
